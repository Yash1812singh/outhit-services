[pytest]
# Run from the repo root:  .venv/bin/python -m pytest
# Each service has its own tests/ package (with a conftest.py that points that service at a
# throwaway SQLite file and disables its background jobs before any service module is imported).
testpaths = market_data/tests intelligence/tests research/tests advisor/tests paper/tests broker/tests gateway/tests
pythonpath = .
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
